name: WorldGuard checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e './worldguard[dev,api,mcp]'
      - run: python -m pytest -q
        working-directory: worldguard
      - run: node --test worldguard/agh_plugin/guard.test.mjs
      - run: npm ci && npm test && npm run build
        working-directory: worldguard/frontend
