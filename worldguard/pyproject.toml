[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "worldguard"
version = "0.1.0"
description = "Bounded 2D navigation fault testing and independent geometric auditing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
mcp = ["mcp"]
ui = ["streamlit", "fastapi==0.143.0", "uvicorn>=0.34"]
api = ["fastapi==0.143.0", "uvicorn>=0.34"]

[project.scripts]
worldguard = "worldguard.cli:main"
worldguard-api = "worldguard.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
